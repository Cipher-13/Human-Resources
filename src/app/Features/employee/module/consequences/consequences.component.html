<div class="projects-container">
  <div class="container">
    <div class="leave-table table-bordered container mt-4">
      <!-- Top Bar -->
      <div class="d-flex justify-content-end align-items-center mb-3"></div>

      <!-- Table -->
      <div class="table table-striped">
        <table class="table align-middle custom-table">
          <thead>
            <tr>
              <th>نوع الاجراء </th>
              <th>تاريخ الاجراء</th>
              <th>سبب الاجراء</th>
              <th>الاجراء</th>

              <!-- أعمدة فاضية -->
              <th *ngFor="let col of emptyColumns"></th>
              <th>
                <button class="btn btn-outline-gradient">+ إضافة اجراء</button>
              </th>
            </tr>
          </thead>
<tbody>
  <tr *ngFor="let project of projects">
    <td>{{ project.proceduralSort }}</td>
    <td>{{ project.proceduralTime }}</td>
    <td>{{ project.proceduralCause }}</td>

    <!-- ===== عمود الإجراء بعد التعديل ===== -->
    <td class="text-cell" (click)="project.expanded = !project.expanded">

      <!-- النص المختصر -->
      <div class="short-text" [class.hidden]="project.expanded">
        {{ project.procedural }}
      </div>

      <!-- النص الكامل -->
      <div class="full-text" [class.visible]="project.expanded">
        {{ project.procedural }}
      </div>

    </td>

    <!-- أعمدة فاضية -->
    <td *ngFor="let col of emptyColumns"></td>

    <td>
      <button type="button" class="btn btn-outline-gradient">
        <i class="fa-solid fa-eye"></i> <span> عرض </span>
      </button>

      <button type="button" class="btn btn-outline-gradient">
        <img src="assets/images/report.png" alt class="btn-icon" />
        <span> تعديل </span>
      </button>

      <span class="delete-icon">✖</span>
    </td>
  </tr>
</tbody>

        </table>
      </div>
    </div>
  </div>
</div>
