<div class="table-container container mt-4">
  <table class="table table-striped table-hover align-middle text-center">
    <thead class="table-header">
  <tr>
    <th>اسم</th>
    <th></th>
    <th>القيمة</th>
    <th></th>
    <th>عدد الايام</th>
    <th></th>
    <th>عدد الساعات(ان وجد)</th>

    <!-- 🔥 الأعمدة الفاضية الديناميكية -->
    <th *ngFor="let c of emptyColumns"></th>

    <!-- 🔥 عمود إضافة راتب ثابت -->
    <th>
      <div class="d-flex align-items-center justify-content-end gap-3">

        <div class="date-picker-wrapper">
          <button class="date-button month-btn" (click)="picker.open()">
            <span class="arrow">⌄</span>
            <span class="text">{{ selectedMonthLabel }}</span>
            <i class="fa-solid fa-calendar-days mx-1"></i>
          </button>

          <mat-datepicker
            #picker
            startView="multi-year"
            (monthSelected)="monthSelected($event, picker)"
            (dateChange)="dateSelected($event)"
          ></mat-datepicker>

          <input matInput [matDatepicker]="picker" hidden />
        </div>

     <button type="button"
        class="btn btn-outline-gradient"
        data-bs-toggle="modal"
        data-bs-target="#addSalaryModal">
  + <span> اضافة راتب</span>
</button>
 </div>
    </th>
  </tr>
</thead>

    <tbody>
  <tr>
    <td>الراتب الاساسي</td>
    <td></td>
    <td>24$</td>
    <td></td>
    <td>18 يوم</td>
    <td></td>
    <td>144 ساعة</td>

    <!-- 🔥 نفس عدد الأعمدة الفاضية ← محاذاة محسوبة -->
    <td *ngFor="let c of emptyColumns"></td>

    <td>
      <button type="button" class="btn btn-outline-gradient">
        <img src="assets/images/report.png" alt class="btn-icon" />
        <span> تعديل </span>
      </button>
    </td>
  </tr>

  <tr>
    <td>حوافز</td>
    <td></td>
    <td>24$</td>
    <td></td>
    <td>18 يوم</td>
    <td></td>
    <td>144 ساعة</td>

    <td *ngFor="let c of emptyColumns"></td>

    <td>
      <button type="button" class="btn btn-outline-gradient">
        <img src="assets/images/report.png" alt class="btn-icon" />
        <span> تعديل </span>
      </button>
    </td>
  </tr>

  <tr>
    <td>عمل اضافي</td>
    <td></td>
    <td>24$</td>
    <td></td>
    <td></td>
    <td></td>
    <td></td>

    <td *ngFor="let c of emptyColumns"></td>

    <td>
      <button type="button" class="btn btn-outline-gradient">
        <img src="assets/images/report.png" alt class="btn-icon" />
        <span> تعديل </span>
      </button>
    </td>
  </tr>
</tbody>

  </table>
</div>

<nav aria-label="صفحات">
  <ul class="pagination justify-content-start flex-row-reverse">
    <li class="page-item">
      <a class="page-link" href="#" aria-label="السابق">
        <span aria-hidden="true">&raquo;</span>
        <!-- سهم لليسار -->
      </a>
    </li>

    <li class="page-item active">
      <a class="page-link" href="#">٢</a>
      <!-- رقم بالعربي -->
    </li>

    <li class="page-item">
      <a class="page-link" href="#" aria-label="التالي">
        <span aria-hidden="true">&laquo;</span>
        <!-- سهم لليمين -->
      </a>
    </li>
  </ul>
</nav>

<!-- Add salaries Allowlance Modal -->
<div class="modal fade" id="addSalaryModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content addSalaryModal">

    <div class="modal-header d-flex justify-content-between border-0">
  <h5 class="modal-title">💰 اضافة رواتب/حوافز/بدلات</h5>
  <button type="button" class="btn-close" data-bs-dismiss="modal">✖</button>

</div>

      <div class="modal-body">

        <div class="row g-4">


          <div class="col-md-6">
            <label class="form-label">اسم الموظف</label>
            <select class="form-select">
              <option selected>خالد حسن</option>
            </select>
          </div>


 <div class="col-md-6">
            <label class="form-label">المسمي</label>
            <input type="text" class="form-control" placeholder="راتب شهري " />
          </div>



          <div class="col-md-6">
            <label class="form-label">القيمة</label>
            <input type="text" class="form-control" placeholder="$" />
          </div>


              <div class="col-md-6">
            <label class="form-label">ايام العمل (ان وجد)</label>
            <input type="text" class="form-control" placeholder="13 يوم" />
          </div>


          <div class="col-md-12">
            <label class="form-label">سبب الاضافة</label>
           <input type="text" class="form-control" placeholder=" مرتب شهر اكتوبر " />
          </div>

        </div>

      </div>

      <div class="modal-footer border-0">
        <button type="button" class="confirm-btn">تأكيد</button>
      </div>

    </div>
  </div>
</div>
