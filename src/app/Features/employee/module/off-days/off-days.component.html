<div class="container">
  <div class="second">
    <div class="total">

      <!-- Cards Section -->
      <div class="card" *ngFor="let leave of leaveCards">
        <div class="row-data">
      <p class="icon" [innerHTML]="leave.icon"></p>    <div class="d-flex flex-column txt">
            <p>{{ leave.type }}</p>
            <p>{{ leave.days }}</p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="leave-table table-bordered container mt-4">
    <div class="d-flex justify-content-end align-items-center mb-3">
      <div class="d-flex align-items-center gap-2">

        <!-- Month & Date Picker -->
        <div class="date-picker-wrapper">
          <button class="date-button month-btn" (click)="picker.open()">
            <span class="arrow">⌄</span>
            <span class="text">{{ selectedMonthLabel }}</span>
            <i class="fa-solid fa-calendar-days"></i>
          </button>

          <mat-datepicker
            #picker
            startView="multi-year"
            (monthSelected)="monthSelected($event, picker)"
            (dateChange)="dateSelected($event)">
          </mat-datepicker>

          <input matInput [matDatepicker]="picker" hidden />
        </div>

        <button class="btn btn-outline-gradient">إضافة إجازة +</button>

      </div>
    </div>

    <div class="table table-striped">
      <table class="table align-middle custom-table">
        <thead>
          <tr>
            <th>نوع الإجازة</th>
            <th>تاريخ</th>
            <th>عدد الأيام</th>
            <th>الحالة</th>
            <th></th>
            <th></th>
            <th>الإجراءات</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let leave of leaveRows" [@fadeSlide]>

            <td>{{ leave.type }}</td>
            <td>{{ leave.date }}</td>
            <td>{{ leave.days }}</td>

            <td>
              <span class="status {{ leave.status }}">
                {{
                  leave.status === 'approved'
                    ? 'تم الموافقة عليها'
                    : leave.status === 'rejected'
                    ? 'مرفوضة'
                    : 'قيد المراجعة'
                }}
              </span>
            </td>

            <td></td>

            <td>
              <ng-container *ngIf="leave.status === 'pending'">
                <button class="btn btn-outline-gradient">قبول الطلب <span><i class="fa-solid fa-check"></i></span></button>
              </ng-container>
            </td>

            <td>
              <span class="delete-icon"><i class="fa-solid fa-xmark text-danger"></i></span>
            </td>

          </tr>
        </tbody>

      </table>
    </div>

  </div>
</div>
